services:
  rider:
    build:
      context: ../..
      args:
        APP: rider
    image: rideshare/rider:dev
    restart: unless-stopped
    environment:
      REDIS_URL: redis://rider:${REDIS_RIDER_PASSWORD:?set REDIS_RIDER_PASSWORD in .env}@redis:6379/0
      REDIS_KEY_PREFIX: 'rider:'
      POSITION_TTL_S: ${POSITION_TTL_S:-600}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3002/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
