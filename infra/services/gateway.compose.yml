services:
  gateway:
    build:
      context: ../..
      args:
        APP: gateway
    image: rideshare/gateway:dev
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PROXY_TIMEOUT_MS: ${PROXY_TIMEOUT_MS:-10000}
      JWKS_CACHE_MAX_AGE_MS: ${JWKS_CACHE_MAX_AGE_MS:-300000}
      JWKS_COOLDOWN_MS: ${JWKS_COOLDOWN_MS:-30000}
    # The only published port of the stack (besides web later): the public entry point.
    ports:
      - '${GATEWAY_HOST_PORT:-8080}:8080'
    depends_on:
      user:
        condition: service_healthy
      rider:
        condition: service_healthy
      driver:
        condition: service_healthy
      routing:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
