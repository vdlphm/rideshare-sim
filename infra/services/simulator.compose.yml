services:
  simulator:
    build:
      context: ../..
      args:
        APP: simulator
    image: rideshare/simulator:dev
    restart: unless-stopped
    environment:
      SIM_DEFAULT_SPEED: ${SIM_DEFAULT_SPEED:-1}
      SIM_DEFAULT_DRIVER_COUNT: ${SIM_DEFAULT_DRIVER_COUNT:-50}
      SIM_DEFAULT_SPAWN_INTERVAL_S: ${SIM_DEFAULT_SPAWN_INTERVAL_S:-3}
      SIM_DEFAULT_ACCEPT_PROBABILITY: ${SIM_DEFAULT_ACCEPT_PROBABILITY:-0.9}
      SIM_START_PAUSED: ${SIM_START_PAUSED:-false}
      SIMULATOR_CLIENT_SECRET: ${SIMULATOR_CLIENT_SECRET:?set SIMULATOR_CLIENT_SECRET in .env}
      SIM_BOT_PASSWORD: ${SIM_BOT_PASSWORD:?set SIM_BOT_PASSWORD in .env}
      SIM_BOTS_ENABLED: ${SIM_BOTS_ENABLED:-true}
      SIM_MAX_ACTIVE_RIDERS: ${SIM_MAX_ACTIVE_RIDERS:-100}
      OFFER_TTL_SIM_MS: ${OFFER_TTL_SIM_MS:-15000}
      GATEWAY_URL: ${SIM_GATEWAY_URL:-http://gateway:8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    # The bots call the gateway at runtime without depending on it: the gateway waits for us.
    depends_on:
      user:
        condition: service_healthy
      routing:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3007/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
