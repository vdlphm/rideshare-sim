# Local stack. No host ports are published for Postgres, Redis or OSRM: services reach them
# on the compose network as postgres:5432, redis:6379 and osrm:5000.
name: rideshare

include:
  - postgres/compose.yml
  - redis/compose.yml
  - osrm/compose.yml
  - services/user.compose.yml
  - services/routing.compose.yml
  - services/simulator.compose.yml
  - services/driver.compose.yml
  - services/trip.compose.yml
  - services/matching.compose.yml
  - services/rider.compose.yml
  - services/gateway.compose.yml
